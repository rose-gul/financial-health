name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The pipeline runs fully offline (rule-based); no secrets are required.
jobs:
  run:
    name: run pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Use bash on every OS so the shell steps below behave identically.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py --input data/transactions.csv

      - name: Assert reports were written
        run: |
          test -f outputs/report.json || { echo "missing report.json"; exit 1; }
          test -f outputs/report.csv  || { echo "missing report.csv";  exit 1; }
          echo "report.json and report.csv present"

      - name: Isolation test — malformed input must fail cleanly
        run: |
          printf 'date,description,amount\n2026-06-01,Good Row,100.00\n2026-06-02,Bad Row,NOT_A_NUMBER\n' > bad.csv
          if python main.py --input bad.csv; then
            echo "ERROR: pipeline should have failed on malformed CSV"
            exit 1
          else
            echo "OK: pipeline stopped cleanly on malformed CSV (exit $?)"
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-report-${{ matrix.os }}
          path: outputs/
          if-no-files-found: warn
